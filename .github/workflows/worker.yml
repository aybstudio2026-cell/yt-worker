name: YT Automation Worker

on:
  schedule:
    # Corre cada 10 minutos. La sintaxis cron es en UTC, no en tu hora local.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # Permite dispararlo manualmente desde la pestaña "Actions" en GitHub, util para pruebas

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Seguridad: si algo se cuelga, se cancela solo

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar navegador de Playwright
        run: playwright install --with-deps chromium

      - name: Restaurar credenciales desde Secrets
        run: |
          mkdir -p credentials
          echo "${{ secrets.CLIENT_SECRET_JSON }}" | base64 -d > credentials/client_secret.json
          echo "${{ secrets.TOKEN_IMGONNAGOVIRAL }}" | base64 -d > credentials/token_Imgonnagoviral.pickle
          echo "${{ secrets.STUDIO_SESSION_IMGONNAGOVIRAL }}" | base64 -d > credentials/studio_session_Imgonnagoviral.json

      - name: Ejecutar worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python worker.py

      - name: Subir capturas como artifact (temporal, para revisar visualmente)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas/
          if-no-files-found: ignore
          retention-days: 3